name: Bump version on release publish

# Fires after .github/workflows/release.yml publishes a completed release.
# It keeps every version file aligned with the released tag if the tag was
# prepared without a local version commit.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump all version files
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -e
          VERSION="${TAG#v}"
          echo "Bumping version files to $VERSION"

          # package.json (source of truth for the release tag check)
          sed -i "s/\"version\": \"[0-9]*\.[0-9]*\.[0-9]*\"/\"version\": \"$VERSION\"/" package.json
          # package-lock.json (top-level metadata and root package entry)
          npm version "$VERSION" --package-lock-only --allow-same-version --ignore-scripts
          # src-tauri/tauri.conf.json
          sed -i "s/\"version\": \"[0-9]*\.[0-9]*\.[0-9]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          # src-tauri/Cargo.toml
          sed -i "s/^version = \"[0-9]*\.[0-9]*\.[0-9]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          # src-tauri/Cargo.lock (the coffee-note package entry)
          sed -i "0,/^name = \"coffee-note\"/{/^name = \"coffee-note\"/{n; s/version = \"[0-9]*\.[0-9]*\.[0-9]*\"/version = \"$VERSION\"/}}" src-tauri/Cargo.lock
          # website/version.json (drives the installer's update check)
          echo "{\"version\": \"$VERSION\"}" > website/version.json

          if git diff --quiet; then
            echo "All version files already at $VERSION — nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock website/version.json
          git commit -m "chore: bump version to $VERSION"
          git push origin main
