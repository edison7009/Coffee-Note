[package]
name = "coffee-note"
version = "0.0.7"
description = "Local-first note system with tier-based organization and AI assistance"
authors = ["Coffee Team"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "coffee_note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
dirs = "6"
chrono = "0.4"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "fs", "io-util", "process"] }
reqwest-eventsource = "0.6"
tokio-util = "0.7"
futures-util = "0.3"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
symphonia = { version = "0.5", features = ["aac", "flac", "isomp4", "mp3", "ogg", "vorbis", "wav"] }
hound = "3"
base64 = "0.22"
