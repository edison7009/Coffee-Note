# Coffee Note's pinned DeepSeek Harness composition.
# stdout belongs exclusively to the JSON-RPC transport.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: true

- id: llm
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers: !!js JSON.parse(process.env.COFFEE_NOTE_DSH_PROVIDER ?? '{}')

# Official DeepSeek traffic uses DSH's first-party adapter. It preserves
# reasoning passback only across tool rounds and exposes prefix-cache reads.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: COFFEE_NOTE_DSH_API_KEY
    baseURL: !!js process.env.COFFEE_NOTE_DSH_DEEPSEEK_BASE_URL ?? 'https://api.deepseek.com'
    thinking: enabled
    reasoningEffort: !!js process.env.COFFEE_NOTE_DSH_DEEPSEEK_REASONING ?? 'high'
    maxTokens: !!js Number(process.env.COFFEE_NOTE_DSH_MAX_OUTPUT_TOKENS ?? 4096)
    defaultContextWindow: !!js Number(process.env.COFFEE_NOTE_DSH_CONTEXT_WINDOW ?? 131072)
    models:
      - id: !!js process.env.COFFEE_NOTE_DSH_MODEL ?? 'deepseek-chat'
        contextWindow: !!js Number(process.env.COFFEE_NOTE_DSH_CONTEXT_WINDOW ?? 131072)
        maxTokens: !!js Number(process.env.COFFEE_NOTE_DSH_MAX_OUTPUT_TOKENS ?? 4096)

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: !!js process.env.COFFEE_NOTE_DSH_SYSTEM_PROMPT
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false

- id: coffee-tools
  name: './src/coffee-tools.mjs'

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.COFFEE_NOTE_DSH_SESSION_ROOT
    compression: zstd

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: tool-call-timeout
  name: '@deepseek-ai/dsh-tool-call-timeout-policy'
  config:
    timeoutMs: 120000

- id: tool-result-pruner
  name: '@deepseek-ai/dsh-compaction-tool-result-pruner'

- id: compaction
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.2
    maxTokens: !!js Number(process.env.COFFEE_NOTE_DSH_MAX_OUTPUT_TOKENS ?? 4096)
    compactionRetries: 1
